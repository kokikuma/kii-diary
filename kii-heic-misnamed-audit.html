<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kii Diary HEIC判定</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#f7f7f7;color:#222;margin:0;padding:24px}
.wrap{max-width:820px;margin:auto}
.card{background:white;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:16px}
button{border:0;border-radius:10px;padding:12px 18px;background:#56C3F0;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.muted{color:#666;font-size:14px}
.big{font-size:30px;font-weight:800}
pre{white-space:pre-wrap;word-break:break-word;background:#f3f3f3;padding:12px;border-radius:10px;max-height:360px;overflow:auto}
.row{display:flex;gap:12px;flex-wrap:wrap}
.stat{flex:1;min-width:150px;background:#fafafa;border-radius:12px;padding:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>Momento画像 実体判定</h2>
    <p class="muted">Attachments または kii_unreadable フォルダを選ぶと、拡張子ではなくファイルの中身を見て HEIC / JPEG / PNG / その他 を数えます。ファイルは変更しません。</p>
    <input id="picker" type="file" webkitdirectory multiple>
    <div style="margin-top:12px"><button id="run" disabled>フォルダ全体を判定</button></div>
    <p id="status" class="muted"></p>
  </div>

  <div class="card" id="result" style="display:none">
    <div class="row">
      <div class="stat"><div class="muted">総ファイル</div><div id="total" class="big">0</div></div>
      <div class="stat"><div class="muted">HEIC/HEIF実体</div><div id="heic" class="big">0</div></div>
      <div class="stat"><div class="muted">JPEG実体</div><div id="jpeg" class="big">0</div></div>
      <div class="stat"><div class="muted">PNG実体</div><div id="png" class="big">0</div></div>
      <div class="stat"><div class="muted">その他/不明</div><div id="other" class="big">0</div></div>
    </div>
    <h3>.jpg なのに中身がHEIC</h3>
    <p class="muted">今回いちばん疑っているパターンです。</p>
    <div class="big" id="misnamed">0</div>
    <button id="saveList" disabled style="margin-top:10px">HEIC実体の一覧を保存</button>
    <pre id="list"></pre>
  </div>
</div>
<script>
const picker=document.getElementById('picker');
const run=document.getElementById('run');
const status=document.getElementById('status');
const result=document.getElementById('result');
const listEl=document.getElementById('list');
const saveList=document.getElementById('saveList');
let files=[], heicNames=[];

picker.addEventListener('change',()=>{
  files=[...picker.files];
  run.disabled=!files.length;
  status.textContent=files.length?`${files.length}ファイルを選択しました`:'';
});

function classify(bytes){
  if(bytes.length>=12){
    // JPEG
    if(bytes[0]===0xFF && bytes[1]===0xD8 && bytes[2]===0xFF) return 'jpeg';
    // PNG
    if(bytes[0]===0x89 && bytes[1]===0x50 && bytes[2]===0x4E && bytes[3]===0x47 &&
       bytes[4]===0x0D && bytes[5]===0x0A && bytes[6]===0x1A && bytes[7]===0x0A) return 'png';
    // ISO BMFF / HEIF family: bytes 4..7 = ftyp
    if(bytes[4]===0x66 && bytes[5]===0x74 && bytes[6]===0x79 && bytes[7]===0x70){
      const brand=String.fromCharCode(...bytes.slice(8,12)).toLowerCase();
      const heifBrands=['heic','heix','hevc','hevx','heim','heis','hevm','hevs','mif1','msf1'];
      if(heifBrands.includes(brand)) return 'heic';
    }
  }
  return 'other';
}

run.addEventListener('click',async()=>{
  run.disabled=true; saveList.disabled=true;
  let c={heic:0,jpeg:0,png:0,other:0}, mis=0;
  heicNames=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    try{
      const buf=await f.slice(0,64).arrayBuffer();
      const kind=classify(new Uint8Array(buf));
      c[kind]++;
      if(kind==='heic'){
        heicNames.push(f.webkitRelativePath||f.name);
        if(/\.(jpe?g)$/i.test(f.name)) mis++;
      }
    }catch(e){c.other++}
    if(i%25===0||i===files.length-1) status.textContent=`判定中… ${i+1} / ${files.length}`;
  }
  document.getElementById('total').textContent=files.length;
  document.getElementById('heic').textContent=c.heic;
  document.getElementById('jpeg').textContent=c.jpeg;
  document.getElementById('png').textContent=c.png;
  document.getElementById('other').textContent=c.other;
  document.getElementById('misnamed').textContent=mis;
  listEl.textContent=heicNames.slice(0,500).join('\n') + (heicNames.length>500?`\n…ほか ${heicNames.length-500}件`:'');
  result.style.display='block';
  saveList.disabled=!heicNames.length;
  status.textContent=`完了：HEIC/HEIF実体 ${c.heic}件 / JPEG実体 ${c.jpeg}件 / PNG実体 ${c.png}件 / その他 ${c.other}件`;
  run.disabled=false;
});

saveList.addEventListener('click',()=>{
  const blob=new Blob([heicNames.join('\r\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='kii_heic_actual_files.txt';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
</script>
</body>
</html>
